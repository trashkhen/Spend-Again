[build]
builder = "NIXPACKS"
buildCommand = "corepack disable && npm install -g pnpm@11.1.1 && export PATH=$(npm prefix -g)/bin:$PATH && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@spend-again/bot..."
watchPatterns = ["/apps/bot/**", "/packages/**", "/.node-version", "/nixpacks.toml", "/pnpm-lock.yaml", "/package.json"]

[deploy]
startCommand = "node apps/bot/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "bot"
