[build]
builder = "NIXPACKS"
buildCommand = "pnpm turbo run build --filter=@spend-again/api..."
watchPatterns = ["/apps/api/**", "/packages/**", "/.node-version", "/nixpacks.toml", "/pnpm-lock.yaml", "/package.json"]

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
